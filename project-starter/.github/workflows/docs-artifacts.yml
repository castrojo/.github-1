# Opt-in profile: capture real product evidence, validate it, and make it
# available for documentation. Prefer a central docs repository to own the
# final commit, so its GITHUB_TOKEN has exactly the permissions it needs.
name: Capture documentation artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-artifacts
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Capture a real walkthrough or screenshot
        run: just screenshots
      - name: Validate captured output
        run: |
          test -d walkthrough-out
          find walkthrough-out -type f | grep -E '\.(png|json)$' | grep -q .
      - name: Upload diagnostic and documentation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: <project>-walkthrough
          path: walkthrough-out/
          if-no-files-found: warn
