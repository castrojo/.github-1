name: "Fork Safety Verification"
description: >-
  Verifies that every pull_request workflow is safe to run from a fork: it
  declares explicit permissions, avoids pull_request_target, and guards write
  actions and secrets behind fork-aware conditions. The validator is a
  standalone, unit-tested CLI (check-fork-safety.py) that lives in this action
  and travels with it, so the fork-safety rules are tested in one place instead
  of embedded inline in a workflow step (tuna-os/.github#275).

inputs:
  workflows-dir:
    description: Directory containing the workflow YAML files.
    required: false
    default: ".github/workflows"
  python-version:
    description: Python version to run the validator on.
    required: false
    default: "3.11"
  run-tests:
    description: >-
      Run the validator's own unit tests before the check. They include the
      "must NOT be reported" cases that keep a fork-safety checker from being
      switched off and leaving forks unchecked.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validator unit tests
      if: inputs.run-tests == 'true'
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/check-fork-safety.test.py"

    - name: Install dependencies
      shell: bash
      run: python3 -m pip install pyyaml

    - name: Verify fork safety
      shell: bash
      # Inputs travel through env, never through ${{ }} interpolation into the
      # script body: Actions substitutes expressions into the script text before
      # bash parses it, so a caller-supplied path would be parsed as shell. As
      # an env var the value is data and is passed to the script verbatim.
      env:
        WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
      run: python3 "$GITHUB_ACTION_PATH/check-fork-safety.py"
