name: Feature request
description: Suggest an idea or enhancement for TunaOS
title: "[enhancement] <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea! Check [existing issues](https://github.com/tuna-os/tunaOS/issues)
        and the [roadmap](https://github.com/tuna-os/tunaOS/blob/main/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What gap or pain point does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you interested in implementing this?
      options:
        - label: "Yes — I'd like to work on this (would you like a good-first-issue tag?)"
