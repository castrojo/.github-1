name: Bug report
description: Report a bug in a TunaOS image, installer, or tool
title: "[bug] <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please check
        [existing issues](https://github.com/tuna-os/tunaOS/issues) first.
  - type: input
    id: variant
    attributes:
      label: Variant / Flavor
      description: Which TunaOS variant and desktop flavor (e.g. yellowfin:gnome, albacore:kde, bonito:niri)
      placeholder: "e.g. yellowfin:gnome"
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Image / ISO
      description: Exact image tag or ISO name you are running (from the download page)
      placeholder: "e.g. yellowfin-10-x86_64"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include what you expected to happen.
      placeholder: "Tell us what went wrong..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Boot the ISO...
        2. Install...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      description: Paste any terminal output, journalctl excerpts, or screenshots
      render: shell
  - type: textarea
    id: system
    attributes:
      label: System context
      description: Hardware (esp. GPU for -nvidia flavors), install type (live ISO / bootc / dual-boot)
    validations:
      required: true
