name: Lint (reusable)

# Reusable lint workflow for tuna-os org repositories.
# Runs static analysis on shell scripts, YAML, JSON, Justfiles, and GitHub Actions workflows.
#
# Org-level reusable workflow adopting Hive practice #14 (epic #2250, issue #2260).

on:
  workflow_call:
    inputs:
      checks:
        description: JSON array of checks to run
        required: false
        type: string
        default: '["shellcheck", "yamllint", "json-validate", "action-pin-check", "actionlint", "justfmt"]'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.checks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # main as of 2026-06-09

      - name: Install tools
        run: |
          brew install just shellcheck shfmt yamllint jq actionlint 2>/dev/null || true

      - name: Run shellcheck
        if: matrix.check == 'shellcheck'
        run: |
          echo "==> Running shellcheck..."
          find . -iname "*.sh" -type f \
            -not -path './.build/*' \
            -not -path './vendor/*' \
            -not -path './_upstream-snapshots/*' \
            -exec shellcheck --severity=error --exclude=SC1091,SC2114 --format=tty {} +

      - name: Run yamllint
        if: matrix.check == 'yamllint'
        run: |
          echo "==> Running yamllint..."
          CFG_ARG=""
          if [[ -f .yamllint.yml ]] || [[ -f .yamllint.yaml ]]; then
            CFG_ARG="-c .yamllint.yml"
          fi
          find . \( -name "*.yaml" -o -name "*.yml" \) -type f \
            -not -path './.build/*' \
            -not -path './vendor/*' \
            -not -path './_upstream-snapshots/*' \
            -exec yamllint $CFG_ARG {} +

      - name: Validate JSON files
        if: matrix.check == 'json-validate'
        run: |
          echo "==> Validating JSON syntax..."
          find . -name "*.json" -type f \
            -not -path './.build/*' \
            -not -path './vendor/*' \
            -not -path './_upstream-snapshots/*' \
            -exec sh -c 'jq . "$1" > /dev/null || { echo "ERROR: invalid JSON in $1"; exit 1; }' _ {} \;

      - name: Run actionlint
        if: matrix.check == 'actionlint'
        continue-on-error: true
        run: |
          echo "==> Running actionlint on workflows..."
          actionlint .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || true

      - name: Check action pins to commit SHAs
        if: matrix.check == 'action-pin-check'
        run: |
          echo "==> Checking every external action is pinned to a commit SHA..."
          python3 - <<'PYEOF'
          import pathlib, re, sys
          # Supply-chain gate (tuna-os/.github#175): external `uses:` refs must be
          # a 40-char commit SHA, never a version tag or branch ref. This is the
          # same rule as scripts/check-action-pins.py (the tested canonical
          # implementation); it is embedded here so it travels with the reusable
          # workflow and runs in any caller's lint job with no extra checkout.
          SHA = re.compile(r"^[0-9a-fA-F]{40}$")
          USES = re.compile(r"^\s*(?:-\s+)?uses:\s*(?P<v>.+?)\s*$")

          def clean(raw):
              v = raw.split("#", 1)[0].strip().strip('"').strip("'").strip()
              return v if v and not v.startswith("${{") else ""

          wd = pathlib.Path(".github/workflows")
          files = sorted((f for f in wd.rglob("*") if f.suffix in (".yml", ".yaml"))) if wd.is_dir() else []
          violations = []
          for f in files:
              text = f.read_text(encoding="utf-8")
              for i, line in enumerate(text.splitlines(), 1):
                  if line.lstrip().startswith("#"):
                      continue
                  m = USES.match(line)
                  if not m:
                      continue
                  val = clean(m.group("v"))
                  if not val or val.startswith("."):
                      continue
                  if "@" not in val:
                      violations.append(f"{f}:{i}: {val!r} has no @ref")
                      continue
                  ref = val.rpartition("@")[2]
                  if not SHA.match(ref):
                      violations.append(f"{f}:{i}: {val!r} pinned to {ref!r}, not a 40-char commit SHA")

          if violations:
              print(f"FAIL: {len(violations)} unpinned action reference(s):", file=sys.stderr)
              for v in violations:
                  print(f"  - {v}", file=sys.stderr)
              sys.exit(1)
          print("OK: all external action references are pinned to 40-char commit SHAs.")
          PYEOF

      - name: Check Justfile formatting
        if: matrix.check == 'justfmt'
        run: |
          if [[ -f Justfile ]]; then
            echo "==> Checking Justfile format..."
            just --unstable --fmt --check -f Justfile
          fi
