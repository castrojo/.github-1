name: Agent Byline Check

# Enforces tuna-os/.github#54 against this repo's own committed documents: no
# committed file may attribute org governance to an automation agent or carry
# an ACMM-level byline. PR #55 stripped the byline from the project-starter
# template and from this repo's own ROADMAP.md; this check is what stops it
# returning. It scans the files this repo ships at the source -- the template
# and the roadmap they are copied from -- so a regenerated byline is caught here
# rather than having to be swept out of the 19 repositories that inherit them.
#
# The check is intentionally narrow (an ACMM level, or "by the <role> agent")
# so it never flags a document that merely mentions agents. A gate that flags
# correct prose gets switched off, and then nothing is checked at all.

on:
  push:
    branches: [main]
    paths:
      - "scripts/check-agent-byline.py"
      - "scripts/test-agent-byline-check.py"
      - ".github/workflows/check-agent-byline.yml"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "scripts/check-agent-byline.py"
      - "scripts/test-agent-byline-check.py"
      - ".github/workflows/check-agent-byline.yml"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No agent byline in committed documents
        run: python3 scripts/check-agent-byline.py
      # Pin the boundary so the pattern cannot erode: the exact regression
      # shapes must fail, and every legitimate agent mention in this repo's own
      # documents (SECURITY.md, ROADMAP-INDEX.md, the ROADMAP Q4 goal) must pass.
      - name: Checker self-test
        run: python3 scripts/test-agent-byline-check.py
