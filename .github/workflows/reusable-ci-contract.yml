name: CI Contract Verification (reusable)

# Verifies that every green criterion in .github/green-criteria.yml is asserted by
# reachable workflows, real jobs and steps, and satisfies freshness SLAs.
#
# Org-level reusable workflow adopting Hive practice #1 (epic #2250, issue #2260).

on:
  workflow_call:
    inputs:
      criteria-path:
        description: Path to green-criteria.yml
        required: false
        type: string
        default: .github/green-criteria.yml
      workflows-dir:
        description: Directory containing workflow YAML files
        required: false
        type: string
        default: .github/workflows
      python-version:
        description: Python version to use
        required: false
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  ci-contract:
    name: CI Contract Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: python3 -m pip install pyyaml

      - name: Verify CI contract
        env:
          CRITERIA_PATH: ${{ inputs.criteria-path }}
          WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
        run: |
          python3 scripts/verify-ci-contract.py
