name: Fork Safety (self-check)

# Runs the fork-safety validator's own unit tests (and the check itself) in this
# repo's CI, on every push and pull request to main. This repo's workflows are
# all fork-safe, so the check passes here -- but the point is that the validator
# the reusable fork-safety workflow depends on is exercised on every change to
# it, not only when some caller happens to adopt it (tuna-os/.github#275).
#
# Mirrors ci-contract-check.yml: run the check + its self-test directly in this
# repo rather than via the composite action, so the self-check works on the
# branch before the action exists on main.

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/fork-safety/**"
      - ".github/workflows/reusable-fork-safety.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/fork-safety/**"
      - ".github/workflows/reusable-fork-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    name: Fork Safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python3 -m pip install pyyaml
      - name: Validator unit tests
        run: python3 .github/actions/fork-safety/check-fork-safety.test.py
      - name: Verify fork safety
        run: python3 .github/actions/fork-safety/check-fork-safety.py
